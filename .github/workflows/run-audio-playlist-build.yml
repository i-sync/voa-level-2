name: Run audio playlist build

on:
  push:
    branches:
      - feature/audio-playlist-desktop-dock
    paths:
      - .github/workflows/run-audio-playlist-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract and apply the staged patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(".github/workflows/build-audio-playlist.yml").read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end_marker = "\n          PY\n\n      - name: Install test dependencies"
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          script = script.replace(
              'replace_once("index.html", old_playback, new_playback)',
              'replace_regex("index.html", r\'          <section class="control-block" aria-labelledby="playbackHeading">.*?          </section>\', textwrap.indent(textwrap.dedent(new_playback).strip(), "          "))',
          )
          Path("/tmp/apply_audio_playlist_patch.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/apply_audio_playlist_patch.py

      - name: Install test dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run static and unit tests
        run: |
          node --check js/app.js
          node --check js/core.js
          npm test
          python -m pytest -q
          python -m json.tool data/lessons.json > /dev/null
          git diff --check

      - name: Run browser smoke test
        shell: bash
        run: |
          python -m http.server 8000 > /tmp/voa-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > tests/playlist-smoke.cjs <<'JS'
          const assert = require("node:assert/strict");
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1100, height: 800 } });
            await page.goto("http://127.0.0.1:8000/?lesson=1", { waitUntil: "networkidle" });
            await page.waitForFunction(() => document.querySelectorAll("#lessonSelect option").length === 30);

            assert.equal(await page.locator("audio").count(), 1);
            await page.evaluate(() => document.querySelector("#audioPlayer").dispatchEvent(new Event("play")));
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight * 0.72));
            await page.waitForFunction(() => document.querySelector("#audioDock").classList.contains("is-docked"));
            assert.equal(await page.locator("#audioDock").evaluate((el) => getComputedStyle(el).position), "fixed");

            await page.click("#editPlaylist");
            await page.selectOption("#playlistRangeStart", "1");
            await page.selectOption("#playlistRangeEnd", "3");
            await page.click("#applyPlaylistRange");
            await page.click("#savePlaylist");
            assert.match(await page.textContent("#playlistSummary"), /Lesson 1–3/);
            await page.click('[data-repeat-mode="queue"]');
            assert.equal(await page.getAttribute('[data-repeat-mode="queue"]', "aria-pressed"), "true");

            await page.evaluate(() => document.querySelector("#audioPlayer").dispatchEvent(new Event("ended")));
            await page.waitForFunction(() => new URL(location.href).searchParams.get("lesson") === "2");
            assert.match(await page.textContent("#audioDockTitle"), /2\/3/);

            await page.click("#videoTab");
            await page.waitForFunction(() => !document.querySelector("#audioDock").classList.contains("is-docked"));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          node tests/playlist-smoke.cjs
          rm tests/playlist-smoke.cjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/styles.css js/app.js js/core.js tests/core.test.mjs tests/test_static_site.py README.md AGENTS.md docs/REQUIREMENTS.md
          git commit -m "feat: add lesson playlist looping and desktop audio dock"
          git push origin HEAD:feature/audio-playlist-desktop-dock
