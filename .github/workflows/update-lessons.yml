name: Update VOA lessons

on:
  workflow_dispatch:
  push:
    branches:
      - update/all-lessons-1080
    paths:
      - .github/workflows/update-lessons.yml
      - scripts/import_voa.py
      - tests/test_import_voa.py
      - tests/test_lessons_data.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install importer dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Import all 30 lessons
        run: python scripts/import_voa.py --output data/lessons.json --delay 0.25

      - name: Verify complete 1080p data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/lessons.json").read_text(encoding="utf-8"))
          lessons = payload["lessons"]
          ids = [lesson["id"] for lesson in lessons]
          assert ids == list(range(1, 31)), ids
          assert all(lesson.get("videoQuality") == 1080 for lesson in lessons)
          assert all(lesson.get("transcript") for lesson in lessons)
          print(f"Verified {len(lessons)} lessons, all at 1080p.")
          PY

      - name: Run project tests
        run: |
          npm test
          python -m pytest -q

      - name: Commit refreshed course data
        run: |
          if git diff --quiet -- data/lessons.json; then
            echo "Course data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lessons.json
          git commit -m "data: import all 30 VOA lessons in 1080p"
          git push