name: Complete VOA Level 2 course data

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/complete-course.yml"

permissions:
  contents: write

concurrency:
  group: complete-voa-level-2-course
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install importer dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Upgrade importer and project documentation to the full course
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "scripts/import_voa.py",
              "def choose_video_url(soup: BeautifulSoup, base_url: str, preferred_quality: int = 360) -> str:",
              "def choose_video_url(soup: BeautifulSoup, base_url: str, preferred_quality: int = 1080) -> str:",
          )
          replace_exact(
              "scripts/import_voa.py",
              "    return min(candidates, key=lambda item: (abs(item[0] - preferred_quality), item[0]))[1]\n",
              "    selected = min(\n"
              "        candidates,\n"
              "        key=lambda item: (abs(item[0] - preferred_quality), -item[0]),\n"
              "    )\n"
              "    if selected[0] != preferred_quality:\n"
              "        available = sorted({item[0] for item in candidates})\n"
              "        raise ImportFailure(\n"
              "            f\"Required {preferred_quality}p video is unavailable; found {available}.\"\n"
              "        )\n"
              "    return selected[1]\n",
          )
          replace_exact(
              "scripts/import_voa.py",
              '            "publisher": "VOA Learning English",\n',
              '            "publisher": "VOA Learning English",\n'
              '            "status": "complete" if len(imported) == 30 else "generated",\n'
              '            "videoQuality": "1080p",\n',
          )

          replace_exact(
              "tests/test_import_voa.py",
              "def test_parse_lesson_prefers_360p_and_128_kbps_and_extracts_conversation() -> None:",
              "def test_parse_lesson_prefers_1080p_and_128_kbps_and_extracts_conversation() -> None:",
          )
          replace_exact(
              "tests/test_import_voa.py",
              '<a href="/video-360.mp4?cb=xyz&amp;download=1">360p | 22MB</a>',
              '<a href="/video-1080.mp4?cb=xyz&amp;download=1">1080p | 120MB</a>',
          )
          replace_exact(
              "tests/test_import_voa.py",
              'assert lesson["videoUrl"] == "https://example.test/video-360.mp4?cb=xyz"',
              'assert lesson["videoUrl"] == "https://example.test/video-1080.mp4?cb=xyz"',
          )

          replace_exact(
              "tests/test_lessons_data.py",
              '    assert [lesson["id"] for lesson in payload["lessons"]] == [1, 2, 3]\n',
              '    assert [lesson["id"] for lesson in payload["lessons"]] == list(range(1, 31))\n'
              '    assert payload["course"]["status"] == "complete"\n'
              '    assert payload["course"]["videoQuality"] == "1080p"\n',
          )

          replace_exact(
              "AGENTS.md",
              "- lessons 1–3 as seed data;",
              "- all 30 lessons with VOA 1080p video and 128 kbps audio;",
          )

          replace_exact(
              "README.md",
              "MVP 已放入 Lesson 1–3，用于先验证 iPhone Safari 的媒体链路和锁屏行为：",
              "当前已收录 Lesson 1–30，并使用 VOA 官方 1080p 视频与 128 kbps 音频：",
          )
          replace_exact(
              "README.md",
              "前三课真机验收通过后，再导入剩余 27 课。完整范围和验收清单见 [`docs/REQUIREMENTS.md`](docs/REQUIREMENTS.md)。",
              "完整范围和验收清单见 [`docs/REQUIREMENTS.md`](docs/REQUIREMENTS.md)。",
          )
          replace_exact(
              "README.md",
              "3. 为每课优先选择 360p MP4 和 128 kbps MP3；",
              "3. 为每课严格选择 1080p MP4 和 128 kbps MP3；",
          )

          replace_exact("docs/REQUIREMENTS.md", "版本：0.1", "版本：0.2")
          replace_exact("docs/REQUIREMENTS.md", "状态：开发中", "状态：首版可用")
          replace_exact(
              "docs/REQUIREMENTS.md",
              "- MVP 首批数据为 Lesson 1–3；验证完成后导入全部 30 课。",
              "- 当前数据覆盖 Lesson 1–30。",
          )
          replace_exact(
              "docs/REQUIREMENTS.md",
              "- 首选 VOA 360p MP4，降低移动流量。",
              "- 使用 VOA 官方 1080p MP4。",
          )
          replace_exact(
              "docs/REQUIREMENTS.md",
              "- [ ] Lesson 1–3 均可选择；",
              "- [ ] Lesson 1–30 均可选择；",
          )
          replace_exact(
              "docs/REQUIREMENTS.md",
              "只有前三课通过上述真机验证，才批量导入剩余 27 课。",
              "前三课已完成初步使用验证，全部 30 课已导入；锁屏与定时行为仍需在日常使用中持续验证。",
          )
          requirements = Path("docs/REQUIREMENTS.md").read_text(encoding="utf-8")
          if "- 导入全部 30 课；" in requirements:
              replace_exact(
                  "docs/REQUIREMENTS.md",
                  "- 导入全部 30 课；",
                  "- 课程搜索和筛选；",
              )
          PY

      - name: Import all 30 lessons
        run: python scripts/import_voa.py --output data/lessons.json --delay 0.35 --timeout 45

      - name: Validate complete course data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/lessons.json").read_text(encoding="utf-8"))
          lessons = payload["lessons"]
          assert [lesson["id"] for lesson in lessons] == list(range(1, 31))
          assert payload["course"]["status"] == "complete"
          assert payload["course"]["videoQuality"] == "1080p"
          for lesson in lessons:
              assert lesson["sourceUrl"].startswith("https://learningenglish.voanews.com/")
              assert lesson["videoUrl"].startswith("https://")
              assert lesson["audioUrl"].startswith("https://")
              assert lesson["transcriptStatus"] == "complete"
              assert len(lesson["transcript"]) >= 20, lesson["id"]
          print(f"Validated {len(lessons)} complete lessons.")
          PY
          python -m json.tool data/lessons.json > /dev/null
          node --check js/app.js
          node --check js/core.js
          npm test
          python -m pytest -q
          git diff --check

      - name: Commit the completed course
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import_voa.py tests/test_import_voa.py tests/test_lessons_data.py \
            data/lessons.json README.md AGENTS.md docs/REQUIREMENTS.md
          git commit -m "feat: add all 30 VOA Level 2 lessons in 1080p"
          git push origin HEAD:main
