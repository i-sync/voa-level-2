name: Build audio playlist and desktop dock

on:
  push:
    branches:
      - feature/audio-playlist-desktop-dock
    paths:
      - .github/workflows/build-audio-playlist.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply playlist and responsive dock changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap


          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")


          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, found {count}: {pattern}")
              file.write_text(updated, encoding="utf-8")


          core = r'''export const SPEED_MIN = 0.5;
          export const SPEED_MAX = 1.5;
          export const SPEED_STEP = 0.05;
          export const REPEAT_MODES = ["off", "one", "queue"];

          export function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
          }

          export function normalizeSpeed(value) {
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return 1;
            const stepped = Math.round(clamp(numeric, SPEED_MIN, SPEED_MAX) / SPEED_STEP) * SPEED_STEP;
            return Number(stepped.toFixed(2));
          }

          export function formatSpeed(value) {
            const speed = normalizeSpeed(value);
            return `${speed.toFixed(2).replace(/0$/, "")}×`;
          }

          export function formatMediaTime(seconds) {
            const total = Math.max(0, Math.floor(Number(seconds) || 0));
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const remainder = total % 60;
            if (hours > 0) {
              return `${hours}:${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
            }
            return `${minutes}:${String(remainder).padStart(2, "0")}`;
          }

          export function formatRemaining(milliseconds) {
            const total = Math.max(0, Math.ceil((Number(milliseconds) || 0) / 1000));
            const hours = Math.floor(total / 3600);
            const minutes = Math.floor((total % 3600) / 60);
            const seconds = total % 60;
            if (hours > 0) {
              return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
            }
            return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
          }

          export function parseLessonId(value, lessons, fallbackId = 1) {
            const requested = Number.parseInt(String(value), 10);
            if (lessons.some((lesson) => lesson.id === requested)) return requested;

            const fallback = Number.parseInt(String(fallbackId), 10);
            if (lessons.some((lesson) => lesson.id === fallback)) return fallback;

            return lessons[0]?.id ?? 1;
          }

          export function getAdjacentLessonId(lessons, currentId, direction) {
            const index = lessons.findIndex((lesson) => lesson.id === currentId);
            if (index < 0) return null;
            return lessons[index + direction]?.id ?? null;
          }

          export function normalizeCustomTimerMinutes(value) {
            const minutes = Number.parseInt(String(value), 10);
            if (!Number.isFinite(minutes)) return null;
            return clamp(minutes, 1, 240);
          }

          export function normalizeRepeatMode(value, legacyLoop = false) {
            if (REPEAT_MODES.includes(value)) return value;
            return legacyLoop ? "one" : "off";
          }

          export function normalizeLessonQueue(values, lessons) {
            const validIds = new Set(
              lessons
                .map((lesson) => Number(typeof lesson === "number" ? lesson : lesson?.id))
                .filter((id) => Number.isInteger(id) && id > 0),
            );
            return [...new Set((Array.isArray(values) ? values : []).map(Number))]
              .filter((id) => validIds.has(id))
              .sort((a, b) => a - b);
          }

          export function getQueueLessonId(queue, currentId, direction = 1) {
            if (!Array.isArray(queue) || queue.length === 0) return null;
            const index = queue.indexOf(Number(currentId));
            if (index < 0) return direction < 0 ? queue.at(-1) : queue[0];
            const offset = ((index + direction) % queue.length + queue.length) % queue.length;
            return queue[offset];
          }

          export function formatLessonQueue(queue) {
            if (!Array.isArray(queue) || queue.length === 0) return "未设置播放列表";
            const ids = [...queue].map(Number).filter(Number.isFinite).sort((a, b) => a - b);
            const contiguous = ids.every((id, index) => index === 0 || id === ids[index - 1] + 1);
            if (contiguous && ids.length > 1) {
              return `Lesson ${ids[0]}–${ids.at(-1)} · ${ids.length} 课`;
            }
            const displayed = ids.length <= 6 ? ids.join("、") : `${ids.slice(0, 5).join("、")}…`;
            return `Lesson ${displayed} · ${ids.length} 课`;
          }
          '''
          Path("js/core.js").write_text(textwrap.dedent(core), encoding="utf-8")

          core_tests = r'''import test from "node:test";
          import assert from "node:assert/strict";

          import {
            formatLessonQueue,
            formatMediaTime,
            formatRemaining,
            formatSpeed,
            getAdjacentLessonId,
            getQueueLessonId,
            normalizeCustomTimerMinutes,
            normalizeLessonQueue,
            normalizeRepeatMode,
            normalizeSpeed,
            parseLessonId,
          } from "../js/core.js";

          const lessons = [
            { id: 1, title: "One" },
            { id: 2, title: "Two" },
            { id: 4, title: "Four" },
          ];

          test("normalizes speed to 0.05 steps and clamps the supported range", () => {
            assert.equal(normalizeSpeed(0.83), 0.85);
            assert.equal(normalizeSpeed(0.1), 0.5);
            assert.equal(normalizeSpeed(2), 1.5);
            assert.equal(normalizeSpeed("bad"), 1);
            assert.equal(formatSpeed(0.8), "0.8×");
            assert.equal(formatSpeed(1), "1.0×");
          });

          test("formats player and timer durations", () => {
            assert.equal(formatMediaTime(0), "0:00");
            assert.equal(formatMediaTime(65.9), "1:05");
            assert.equal(formatMediaTime(3661), "1:01:01");
            assert.equal(formatRemaining(61_001), "01:02");
            assert.equal(formatRemaining(3_661_000), "1:01:01");
          });

          test("resolves valid and fallback lesson IDs", () => {
            assert.equal(parseLessonId("2", lessons, 1), 2);
            assert.equal(parseLessonId("3", lessons, 4), 4);
            assert.equal(parseLessonId("bad", lessons, 99), 1);
          });

          test("finds adjacent lessons without assuming IDs are consecutive", () => {
            assert.equal(getAdjacentLessonId(lessons, 2, -1), 1);
            assert.equal(getAdjacentLessonId(lessons, 2, 1), 4);
            assert.equal(getAdjacentLessonId(lessons, 1, -1), null);
            assert.equal(getAdjacentLessonId(lessons, 4, 1), null);
          });

          test("validates custom sleep timer minutes", () => {
            assert.equal(normalizeCustomTimerMinutes("30"), 30);
            assert.equal(normalizeCustomTimerMinutes(0), 1);
            assert.equal(normalizeCustomTimerMinutes(999), 240);
            assert.equal(normalizeCustomTimerMinutes("not-a-number"), null);
          });

          test("normalizes legacy and explicit repeat modes", () => {
            assert.equal(normalizeRepeatMode("queue"), "queue");
            assert.equal(normalizeRepeatMode("bad", true), "one");
            assert.equal(normalizeRepeatMode(undefined, false), "off");
          });

          test("normalizes, orders and wraps playlist lessons", () => {
            assert.deepEqual(normalizeLessonQueue([4, 2, 2, 99, 1], lessons), [1, 2, 4]);
            assert.equal(getQueueLessonId([1, 2, 4], 2, 1), 4);
            assert.equal(getQueueLessonId([1, 2, 4], 4, 1), 1);
            assert.equal(getQueueLessonId([1, 2, 4], 1, -1), 4);
            assert.equal(getQueueLessonId([1, 2, 4], 99, 1), 1);
          });

          test("formats consecutive and custom playlist summaries", () => {
            assert.equal(formatLessonQueue([]), "未设置播放列表");
            assert.equal(formatLessonQueue([1, 2, 3, 4, 5]), "Lesson 1–5 · 5 课");
            assert.equal(formatLessonQueue([2, 4, 5]), "Lesson 2、4、5 · 3 课");
          });
          '''
          Path("tests/core.test.mjs").write_text(textwrap.dedent(core_tests), encoding="utf-8")

          old_playback = '''          <section class="control-block" aria-labelledby="playbackHeading">
            <h3 id="playbackHeading">重复与跳转</h3>
            <div class="action-row">
              <button id="seekBackward" class="secondary-button" type="button">↶ 10 秒</button>
              <button id="loopToggle" class="toggle-button" type="button" aria-pressed="false">循环本课：关</button>
              <button id="seekForward" class="secondary-button" type="button">10 秒 ↷</button>
            </div>
          </section>'''
          new_playback = '''          <section class="control-block playback-control-block" aria-labelledby="playbackHeading">
            <div class="control-title-row playlist-title-row">
              <h3 id="playbackHeading">重复与播放列表</h3>
              <output id="playlistSummary" class="playlist-summary">Lesson 1–5 · 5 课</output>
            </div>

            <div id="repeatModeControls" class="repeat-mode-row" role="group" aria-label="播放结束后的行为">
              <button class="chip" type="button" data-repeat-mode="off" aria-pressed="true">不循环</button>
              <button class="chip" type="button" data-repeat-mode="one" aria-pressed="false">单课循环</button>
              <button class="chip" type="button" data-repeat-mode="queue" aria-pressed="false">列表循环</button>
            </div>
            <p id="queueModeNote" class="subtle playlist-mode-note">列表循环按课程编号播放，仅用于音频。</p>

            <div class="action-row playlist-action-row">
              <button id="seekBackward" class="secondary-button" type="button">↶ 10 秒</button>
              <button id="editPlaylist" class="secondary-button playlist-edit-button" type="button">选择课程</button>
              <button id="seekForward" class="secondary-button" type="button">10 秒 ↷</button>
            </div>

            <div id="playlistEditor" class="playlist-editor" hidden>
              <div class="playlist-editor-heading">
                <div>
                  <h4>选择循环课程</h4>
                  <p class="subtle">可快速选择连续范围，也可逐课增删；播放顺序按课程编号排列。</p>
                </div>
                <button id="closePlaylistEditor" class="text-button" type="button">关闭</button>
              </div>

              <div class="playlist-range-row">
                <label for="playlistRangeStart">从</label>
                <select id="playlistRangeStart" aria-label="范围开始课程"></select>
                <label for="playlistRangeEnd">到</label>
                <select id="playlistRangeEnd" aria-label="范围结束课程"></select>
                <button id="applyPlaylistRange" class="secondary-button" type="button">应用范围</button>
              </div>

              <div id="playlistLessonGrid" class="playlist-lesson-grid" aria-label="手动选择课程"></div>
              <p id="playlistSelectionStatus" class="playlist-selection-status" aria-live="polite"></p>

              <div class="playlist-editor-actions">
                <button id="clearPlaylist" class="text-button" type="button">清空</button>
                <button id="cancelPlaylist" class="secondary-button" type="button">取消</button>
                <button id="savePlaylist" class="secondary-button" type="button">保存</button>
                <button id="saveAndPlayPlaylist" class="toggle-button" type="button">保存并播放</button>
              </div>
            </div>
          </section>'''
          replace_once("index.html", old_playback, new_playback)

          replace_once(
              "js/app.js",
              '''  formatRemaining,
  formatSpeed,
  getAdjacentLessonId,
  normalizeCustomTimerMinutes,
  normalizeSpeed,
  parseLessonId,''',
              '''  formatLessonQueue,
  formatRemaining,
  formatSpeed,
  getAdjacentLessonId,
  getQueueLessonId,
  normalizeCustomTimerMinutes,
  normalizeLessonQueue,
  normalizeRepeatMode,
  normalizeSpeed,
  parseLessonId,''',
          )
          replace_once("js/app.js", 'const AUDIO_DOCK_QUERY = "(max-width: 620px)";\n', "")
          replace_once(
              "js/app.js",
              '''  speed: 0.8,
  loop: false,
  mode: "audio",
  fontScale: 1,
  currentLesson: 1,''',
              '''  speed: 0.8,
  repeatMode: "off",
  queueLessonIds: [1, 2, 3, 4, 5],
  mode: "audio",
  fontScale: 1,
  currentLesson: 1,''',
          )
          replace_once(
              "js/app.js",
              '''  seekBackward: $("#seekBackward"),
  seekForward: $("#seekForward"),
  loopToggle: $("#loopToggle"),
  timerPresets:''',
              '''  seekBackward: $("#seekBackward"),
  seekForward: $("#seekForward"),
  repeatModeControls: $("#repeatModeControls"),
  playlistSummary: $("#playlistSummary"),
  queueModeNote: $("#queueModeNote"),
  editPlaylist: $("#editPlaylist"),
  playlistEditor: $("#playlistEditor"),
  closePlaylistEditor: $("#closePlaylistEditor"),
  playlistRangeStart: $("#playlistRangeStart"),
  playlistRangeEnd: $("#playlistRangeEnd"),
  applyPlaylistRange: $("#applyPlaylistRange"),
  playlistLessonGrid: $("#playlistLessonGrid"),
  playlistSelectionStatus: $("#playlistSelectionStatus"),
  clearPlaylist: $("#clearPlaylist"),
  cancelPlaylist: $("#cancelPlaylist"),
  savePlaylist: $("#savePlaylist"),
  saveAndPlayPlaylist: $("#saveAndPlayPlaylist"),
  timerPresets:''',
          )
          replace_once(
              "js/app.js",
              '''const lastPositionWrite = { audio: 0, video: 0 };
const audioDockMedia = window.matchMedia(AUDIO_DOCK_QUERY);
let lastSessionPositionUpdate = 0;
let audioDockActivated = false;
let audioDockSlotAboveViewport = false;
let audioDockSuspended = false;
let audioDockObserver = null;''',
              '''const lastPositionWrite = { audio: 0, video: 0 };
let lastSessionPositionUpdate = 0;
let audioDockActivated = false;
let audioDockSlotAboveViewport = false;
let audioDockSuspended = false;
let audioDockObserver = null;
let playlistDraft = new Set();''',
          )

          dock_block = r'''function updateAudioDockMetrics() {
            if (!dom.audioDock.classList.contains("is-docked")) return;
            const height = Math.ceil(dom.audioDock.getBoundingClientRect().height);
            if (height > 0) {
              document.documentElement.style.setProperty("--audio-dock-height", `${height}px`);
            }
          }

          function setAudioDocked(value) {
            const docked = Boolean(value);
            if (dom.audioDock.classList.contains("is-docked") === docked) return;

            if (docked) {
              const placeholderHeight = Math.ceil(dom.audioDock.getBoundingClientRect().height);
              if (placeholderHeight > 0) dom.audioDockSlot.style.height = `${placeholderHeight}px`;
              dom.audioDock.classList.add("is-docked");
              dom.audioDock.setAttribute("aria-label", "浮动音频播放器");
              document.body.classList.add("has-audio-dock");
              requestAnimationFrame(updateAudioDockMetrics);
              return;
            }

            dom.audioDock.classList.remove("is-docked");
            dom.audioDock.removeAttribute("aria-label");
            dom.audioDockSlot.style.removeProperty("height");
            document.body.classList.remove("has-audio-dock");
            document.documentElement.style.removeProperty("--audio-dock-height");
          }

          function updateAudioDock() {
            const shouldDock =
              audioDockActivated &&
              !audioDockSuspended &&
              activeMode === "audio" &&
              audioDockSlotAboveViewport;
            setAudioDocked(shouldDock);
          }

          function currentQueuePositionLabel() {
            if (preferences.repeatMode !== "queue" || !currentLesson) return "";
            const queue = preferences.queueLessonIds;
            const index = queue.indexOf(currentLesson.id);
            return index >= 0 ? `${index + 1}/${queue.length}` : "";
          }

          function updateAudioDockTitle() {
            const queuePosition = currentQueuePositionLabel();
            const title = currentLesson
              ? `Lesson ${currentLesson.id} · ${currentLesson.title}${queuePosition ? ` · ${queuePosition}` : ""}`
              : "VOA Level 2";
            dom.audioDockTitle.textContent = title;
            dom.audioDockTitle.title = title;
          }

          function resetAudioDock() {
            audioDockActivated = false;
            setAudioDocked(false);
            audioDockSlotAboveViewport = dom.audioDockSlot.getBoundingClientRect().bottom <= 0;
          }

          function setAudioDockSuspended(value) {
            audioDockSuspended = Boolean(value);
            updateAudioDock();
          }

          function setupAudioDock() {
            const updateSlotState = () => {
              const rect = dom.audioDockSlot.getBoundingClientRect();
              audioDockSlotAboveViewport = rect.bottom <= 0;
              updateAudioDock();
              updateAudioDockMetrics();
            };

            if ("IntersectionObserver" in window) {
              audioDockObserver = new IntersectionObserver(([entry]) => {
                audioDockSlotAboveViewport =
                  !entry.isIntersecting && entry.boundingClientRect.bottom <= 0;
                updateAudioDock();
              });
              audioDockObserver.observe(dom.audioDockSlot);
            } else {
              window.addEventListener("scroll", updateSlotState, { passive: true });
            }

            window.addEventListener("resize", updateSlotState);
            window.visualViewport?.addEventListener("resize", updateSlotState);
            updateSlotState();
          }'''
          replace_regex(
              "js/app.js",
              r'function updateAudioDockMetrics\(\) \{.*?\n\}\n\nfunction setMode',
              textwrap.dedent(dock_block).rstrip() + "\n\nfunction setMode",
          )

          replace_once(
              "js/app.js",
              '''  updateMediaMetadata();
  updatePlaybackState();
  updateAudioDock();
}''',
              '''  updateMediaMetadata();
  updatePlaybackState();
  renderRepeatControls();
  updateAudioDock();
}''',
          )

          playlist_block = r'''function applyRepeatModeToMedia() {
            const loopCurrentLesson = preferences.repeatMode === "one";
            dom.audio.loop = loopCurrentLesson;
            dom.video.loop = loopCurrentLesson;
          }

          function renderRepeatControls() {
            for (const button of dom.repeatModeControls.querySelectorAll("[data-repeat-mode]")) {
              const selected = button.dataset.repeatMode === preferences.repeatMode;
              button.classList.toggle("is-active", selected);
              button.setAttribute("aria-pressed", String(selected));
            }
            dom.playlistSummary.textContent = formatLessonQueue(preferences.queueLessonIds);
            dom.queueModeNote.textContent =
              preferences.repeatMode === "queue"
                ? activeMode === "audio"
                  ? "列表循环已开启：当前课程结束后自动播放列表中的下一课。"
                  : "列表循环仅自动切换音频；当前视频结束后会停止。"
                : "列表循环按课程编号播放，仅用于音频。";
            updateAudioDockTitle();
          }

          function setRepeatMode(value, { persist = true } = {}) {
            preferences.repeatMode = normalizeRepeatMode(value);
            applyRepeatModeToMedia();
            renderRepeatControls();
            updateMediaMetadata();
            if (persist) savePreferences();
          }

          function renderPlaylistRangeOptions() {
            const start = document.createDocumentFragment();
            const end = document.createDocumentFragment();
            for (const lesson of lessons) {
              for (const fragment of [start, end]) {
                const option = document.createElement("option");
                option.value = String(lesson.id);
                option.textContent = `Lesson ${lesson.id}`;
                fragment.append(option);
              }
            }
            dom.playlistRangeStart.replaceChildren(start);
            dom.playlistRangeEnd.replaceChildren(end);
          }

          function renderPlaylistEditor() {
            const fragment = document.createDocumentFragment();
            for (const lesson of lessons) {
              const button = document.createElement("button");
              const selected = playlistDraft.has(lesson.id);
              button.type = "button";
              button.className = "playlist-lesson-button";
              button.dataset.lessonId = String(lesson.id);
              button.textContent = String(lesson.id);
              button.title = `Lesson ${lesson.id} · ${lesson.title}`;
              button.setAttribute("aria-label", `Lesson ${lesson.id} · ${lesson.title}`);
              button.setAttribute("aria-pressed", String(selected));
              button.classList.toggle("is-selected", selected);
              fragment.append(button);
            }
            dom.playlistLessonGrid.replaceChildren(fragment);
            const ids = [...playlistDraft].sort((a, b) => a - b);
            dom.playlistSelectionStatus.textContent = ids.length
              ? `已选 ${ids.length} 课：${ids.join("、")}`
              : "尚未选择课程。列表循环至少需要两课。";
            const invalid = ids.length < 2;
            dom.savePlaylist.disabled = invalid;
            dom.saveAndPlayPlaylist.disabled = invalid;
          }

          function openPlaylistEditor() {
            playlistDraft = new Set(preferences.queueLessonIds);
            if (playlistDraft.size === 0 && currentLesson) playlistDraft.add(currentLesson.id);
            const ids = [...playlistDraft].sort((a, b) => a - b);
            dom.playlistRangeStart.value = String(ids[0] ?? lessons[0]?.id ?? 1);
            dom.playlistRangeEnd.value = String(ids.at(-1) ?? lessons[Math.min(4, lessons.length - 1)]?.id ?? 1);
            renderPlaylistEditor();
            dom.playlistEditor.hidden = false;
            dom.editPlaylist.setAttribute("aria-expanded", "true");
          }

          function closePlaylistEditor() {
            dom.playlistEditor.hidden = true;
            dom.editPlaylist.setAttribute("aria-expanded", "false");
          }

          function applyPlaylistRange() {
            const start = Number(dom.playlistRangeStart.value);
            const end = Number(dom.playlistRangeEnd.value);
            const min = Math.min(start, end);
            const max = Math.max(start, end);
            playlistDraft = new Set(
              lessons.filter((lesson) => lesson.id >= min && lesson.id <= max).map((lesson) => lesson.id),
            );
            renderPlaylistEditor();
          }

          function savePlaylistSelection({ play = false } = {}) {
            const queue = normalizeLessonQueue([...playlistDraft], lessons);
            if (queue.length < 2) {
              showToast("列表循环至少需要选择两课。 ");
              return;
            }
            preferences.queueLessonIds = queue;
            savePreferences();
            renderRepeatControls();
            closePlaylistEditor();

            if (play) {
              activateQueueMode({ forcePlay: true });
              return;
            }
            if (preferences.repeatMode === "queue" && !queue.includes(currentLesson?.id)) {
              setRepeatMode("off");
              showToast("当前课程不在新列表中，已暂时关闭列表循环。 ");
            }
          }

          function activateQueueMode({ forcePlay = false } = {}) {
            const queue = normalizeLessonQueue(preferences.queueLessonIds, lessons);
            if (queue.length < 2) {
              openPlaylistEditor();
              showToast("请先选择至少两课。 ");
              return;
            }
            preferences.queueLessonIds = queue;
            const wasPlaying = activeMode === "audio" && !dom.audio.paused;
            setMode("audio");
            setRepeatMode("queue");
            const targetId = queue.includes(currentLesson?.id) ? currentLesson.id : queue[0];
            if (targetId !== currentLesson?.id) {
              loadLesson(targetId, {
                historyMode: "replace",
                autoplay: forcePlay || wasPlaying,
                resumeAudio: false,
                preserveDock: audioDockActivated,
                manual: false,
              });
              return;
            }
            if (forcePlay) dom.audio.play().catch(() => showToast("请手动点击播放。"));
          }'''
          replace_regex(
              "js/app.js",
              r'function setLoop\(.*?\n\}\n\nfunction setFontScale',
              textwrap.dedent(playlist_block).rstrip() + "\n\nfunction setFontScale",
          )

          source_block = r'''function setSource(item, mode, url, lessonId, { resume = true } = {}) {
            item.pause();
