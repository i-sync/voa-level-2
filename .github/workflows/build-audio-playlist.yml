          ) {
            const lesson = lessons.find((candidate) => candidate.id === id);
            if (!lesson) return;

            if (manual && preferences.repeatMode === "queue" && !preferences.queueLessonIds.includes(id)) {
              setRepeatMode("off");
              showToast("所选课程不在播放列表中，已暂时关闭列表循环。 ");
