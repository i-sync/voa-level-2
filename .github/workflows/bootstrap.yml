name: Bootstrap MVP

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify and unpack reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/voa-mvp.tar.gz.b64
          base64 --decode /tmp/voa-mvp.tar.gz.b64 > /tmp/voa-mvp.tar.gz
          echo "5671134395784cdda7ed8f3bcae8be95334f47f1c90b185e12aa121013f3165c  /tmp/voa-mvp.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file=/tmp/voa-mvp.tar.gz --directory=. --no-same-owner
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commit the MVP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat: add mobile VOA Level 2 MVP"
          git push
